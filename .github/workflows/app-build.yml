# Compile-only verification for the iOS app and Apple Watch targets.
name: iOS build

on:
  pull_request:
    branches: [main]
    paths:
      - 'Strand/**'
      # The app-target TESTS, not just the sources they cover. The `Test Strand` step below runs
      # StrandTests, but a PR touching only those tests matched nothing here, so it built and ran
      # nothing: one that failed to compile, or simply failed, merged unverified and went red on the
      # next unrelated PR that happened to touch `Strand/**`, mis-attributing the breakage to whoever
      # that was.
      #
      # This is the only test directory that needs naming, and the reason is layout rather than
      # oversight: Android's tests sit under `android/**` and the package suites under `Packages/**`,
      # both already inside their subject's glob, while StrandTests is a SIBLING of `Strand/` instead
      # of part of it. `project.yml` does not cover it either — the target takes
      # `sources: [StrandTests]`, a directory, so adding a test file changes no other tracked path.
      - 'StrandTests/**'
      - 'StrandiOS/**'
      - 'StrandiOSShared/**'
      - 'StrandiOSWidgets/**'
      # The watch app and its complications, for the same reason StrandTests is named above: the
      # NOOPiOS scheme BUILDS them (NOOPiOS embeds NOOPWatch, which embeds NOOPWatchComplications),
      # but neither directory sits under any glob here, so a PR touching only them matched nothing
      # and compiled nothing. A broken watch target merged unverified and surfaced on the next PR
      # that happened to touch Strand/**, pointing at the wrong change. #2227 translated 25
      # complication strings and got no build at all, which is what surfaced this.
      - 'NOOPWatch/**'
      - 'NOOPWatchComplications/**'
      - 'Packages/**'
      - 'project.yml'
      - '.github/workflows/app-build.yml'
  # No `push: main` leg. Every change reaches main through a PR, which the trigger above already
  # gates, so a push run rebuilt content that had just been built - on macOS runners, which GitHub
  # bills at 10x Linux for a two-runner matrix (macos-15 for the universal macOS leg, macos-26 for
  # the iOS 26 SDK). A RELEASE pushes straight to main with no PR, but fork-release.yml builds both
  # Strand and NOOPiOS itself, so that path keeps its own compile gate. The gap this leaves is a
  # direct non-release push to main; `workflow_dispatch` below covers checking one on demand.
  # `pr:` builds a PR's MERGE RESULT without pushing anything. Checking "does this PR compile once
  # merged?" used to mean creating a throwaway `ci/` branch holding main+PR and dispatching at it —
  # which left a "Compare & pull request" banner behind for every probe, because GitHub keys that
  # banner off the PUSH EVENT and it outlives the branch the cleanup job deletes. GitHub already
  # maintains exactly the ref we were hand-building, at refs/pull/<n>/merge, so no branch is needed.
  #
  # Leave it blank to build whatever ref you dispatched against, unchanged.
  workflow_dispatch:
    inputs:
      pr:
        description: "PR number to build as merged into main (blank = build this ref as-is)"
        required: false
        default: ""

concurrency:
  # Keyed on the PR when one is given, so two probes of the SAME pr supersede each other while probes
  # of different PRs (all dispatched from main) do not cancel one another.
  group: app-build-${{ inputs.pr && format('pr-{0}', inputs.pr) || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build NOOPiOS
        run: >-
          xcodebuild -scheme NOOPiOS -configuration Debug
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
          build
