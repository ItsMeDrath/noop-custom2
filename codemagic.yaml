# Manual cloud build: Codemagic supplies the Mac; no Apple secrets for this unsigned IPA.
workflows:
  whoop-unsigned-ipa:
    name: WHOOP - unsigned iPhone IPA for Sideloadly
    instance_type: mac_mini_m2
    max_build_duration: 45
    environment:
      xcode: latest
    scripts:
      - name: Check project and Apple build tools
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR"
          test -f Package.swift
          test -d WHOOP.xcodeproj
          test -f Scripts/package-ipa-on-mac.sh
          xcodebuild -version
          swift --version
          python3 --version
      - name: Test portable core and device-package validator
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR"
          python3 Scripts/validate-nutrition-resource.py
          swift test --parallel
          python3 -m unittest discover -s Scripts/tests -v
      - name: Build arm64 iPhone application and package IPA
        script: |
          set -euo pipefail
          cd "$CM_BUILD_DIR"
          bash Scripts/package-ipa-on-mac.sh
    artifacts:
      - build/WHOOP-unsigned.ipa
      - build/WHOOP-unsigned.ipa.sha256
      - build/device-build.*/xcodebuild.log
      - build/device-build.*/package-check.json
      - build/device-build.*/WHOOP.xcresult/**
# No triggering or publishing block: start manually; no email, store submission or deployment.
